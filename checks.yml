name: Daily project checks
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -v
      - run: python app.py --demo --output runs
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: runs/
